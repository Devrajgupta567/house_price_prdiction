server:
  port: 9090

spring:
  application:
    name: valualtion-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/valualtion;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── Email / SMTP Configuration ─────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:getvalaltion@gmail.com}
    password: ${SMTP_PASSWORD:tgxruqdpmcbyuavm}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000  # 24 hours

  ml-service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}

  email:
    # Enabled real email sending via Gmail SMTP
    enabled: ${EMAIL_ENABLED:true}
    from: ${SMTP_FROM:getvalaltion@gmail.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:8000}
