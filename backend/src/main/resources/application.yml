server:
  port: ${PORT:-10000}

spring:
  application:
    name: valualtion-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/valualtion;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── Email / SMTP Configuration ─────────────────────────────────────────────
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:getvalaltion@gmail.com}
    password: ${SMTP_PASSWORD:tgxruqdpmcbyuavm}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
        debug: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000  # 24 hours

  ml-service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}  # Render sets full https:// URL via env var override

  email:
    # Enabled real email sending via Resend HTTP API or SMTP
    enabled: ${EMAIL_ENABLED:true}
    from: ${SMTP_FROM:getvalaltion@gmail.com}
    resend-api-key: ${RESEND_API_KEY:}
    resend-from: ${RESEND_FROM:ValuAltion <onboarding@resend.dev>}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
