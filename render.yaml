services:
  # ── 1. Python FastAPI ML Microservice ───────────────────────────────────────
  - type: web
    name: valualtion-ml
    runtime: docker
    dockerfilePath: ./Dockerfile.ml
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # ── 2. Spring Boot Java 21 Backend ──────────────────────────────────────────
  - type: web
    name: valualtion-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: valualtion-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: valualtion-ml
          property: url
      - key: EMAIL_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: getvalaltion@gmail.com
      - key: SMTP_PASSWORD
        value: tgxruqdpmcbyuavm

  # ── 3. React Frontend (Static CDN Site) ─────────────────────────────────────
  - type: web
    name: valualtion-web
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: valualtion-backend
          property: host

databases:
  # ── 4. Managed PostgreSQL Database ──────────────────────────────────────────
  - name: valualtion-db
    databaseName: valualtion
    user: valualtion_user
    plan: free
    region: oregon
