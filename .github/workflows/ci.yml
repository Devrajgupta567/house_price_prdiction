name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── 1. Python FastAPI & Machine Learning Validation ─────────────────────────
  test-ml-service:
    name: Test ML Service (FastAPI & Models)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt pytest httpx

      - name: Run FastAPI & Model Inference Tests
        run: |
          pytest tests/test_api_smoke.py -v

  # ── 2. Spring Boot Java 21 Backend Validation ──────────────────────────────
  test-backend:
    name: Test Spring Boot API (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build & Run Tests with Maven
        working-directory: ./backend
        run: mvn clean test -B

  # ── 3. React + Vite Frontend Validation ────────────────────────────────────
  build-frontend:
    name: Build React Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Compile production bundle
        working-directory: ./web
        run: npm run build

  # ── 4. Unified Docker Compose Build Validation ─────────────────────────────
  docker-validation:
    name: Docker Compose Build Verification
    needs: [test-ml-service, test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build all multi-stage Docker images
        run: docker compose build --parallel
